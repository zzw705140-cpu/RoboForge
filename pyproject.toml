[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roboforge"
version = "0.1.0"
description = "RoboForge robot learning and ACT workflows"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["roboforg*", "examples*", "platform*"]
